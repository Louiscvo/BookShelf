version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bookshelf-db
    environment:
      POSTGRES_USER: bookshelf
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookshelf}
      POSTGRES_DB: bookshelf
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshelf"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: bookshelf-api
    environment:
      DATABASE_URL: postgresql://bookshelf:${DB_PASSWORD:-bookshelf}@db:5432/bookshelf
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web-app
      args:
        VITE_API_URL: ${API_URL:-http://localhost:8000}
    container_name: bookshelf-web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
